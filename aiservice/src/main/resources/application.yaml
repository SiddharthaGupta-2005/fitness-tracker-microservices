server:
  port: 8083

spring:
  application:
    name: ai-service
  main:
    banner-mode: off
  config:
    import: optional:configserver:http://localhost:8888
  data:
    mongodb:
      uri: mongodb://localhost:27017/fitnessrecommendation
      database: fitnessrecommendation
  mongodb:
    uri: mongodb://localhost:27017/fitnessrecommendation
    database: fitnessrecommendation
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking

openrouter:
  api:
    url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
    key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:openrouter/free}